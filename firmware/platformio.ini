; Firmware mluvící krabičky. Každý krok má vlastní prostředí a adresář v src/.
; Nahrání: pio run -e 01_mistni_echo -t upload && pio device monitor

[platformio]
default_envs = 01_mistni_echo

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; Mikrofon → 3 s nahrávka → přehrání. Ověří zapojení bez sítě.
[env:01_mistni_echo]
build_src_filter = +<01_mistni_echo/>

; Podržíš BOOT a mluvíš, audio jde přes WebSocket na server a vrátí se zpět.
[env:02_echo_server]
build_src_filter = +<02_echo_server/>
lib_deps =
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1
